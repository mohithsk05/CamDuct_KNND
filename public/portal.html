<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamDuct KNND — Entry Portal</title>
  <meta name="description" content="CamDuct KNND — Admin, Manager & Department Entry Portal">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h1>CamDuct KNND</h1>
        <p class="login-brand-sub">Inventory Management System</p>
      </div>

      <!-- Portal Heading -->
      <div class="portal-heading">
        <h1>ADMIN, MANAGER &amp;<br>DEPARTMENT ENTRY PORTAL</h1>
      </div>

      <!-- Form -->
      <div class="login-form">
        <p class="login-form-title">Sign in with your authorised credentials</p>

        <div id="portal-error" class="login-error hidden">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="portal-error-msg">Invalid credentials</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="portal-username">Username</label>
          <input
            class="form-input"
            type="text"
            id="portal-username"
            placeholder="Enter your username"
            autocomplete="username"
            spellcheck="false"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="portal-password">Password</label>
          <div class="input-password-wrap">
            <input
              class="form-input"
              type="password"
              id="portal-password"
              placeholder="Enter your password"
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" id="portal-pw-toggle" title="Show/hide password">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-lg login-submit" id="portal-submit" type="button">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Sign In
        </button>

        <div style="text-align:center; margin-top:6px;">
          <a href="/index.html" style="font-size:0.78rem; color:var(--text-muted); text-decoration:underline;">← Back to gate login</a>
        </div>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        <p>© 2024 CamDuct KNND &nbsp;·&nbsp; All rights reserved</p>
      </div>

    </div>
  </div>

  <script>
    const API = '/api';

    // Guard: must have gate token
    if (!sessionStorage.getItem('gate_token')) {
      window.location.href = '/index.html';
    }

    // Password toggle
    document.getElementById('portal-pw-toggle').addEventListener('click', () => {
      const pw = document.getElementById('portal-password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // Enter key
    ['portal-username','portal-password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('portal-submit').click();
      });
    });

    // Role → page routing
    function routeUser(user) {
      // Save full user to sessionStorage
      sessionStorage.setItem('auth_user', JSON.stringify(user));

      if (user.role === 'admin') {
        window.location.href = '/admin-dashboard.html';
      } else if (user.role === 'manager') {
        window.location.href = '/manager-dashboard.html';
      } else {
        // department user
        window.location.href = '/dept-dashboard.html';
      }
    }

    document.getElementById('portal-submit').addEventListener('click', async () => {
      const btn = document.getElementById('portal-submit');
      const errEl = document.getElementById('portal-error');
      const errMsg = document.getElementById('portal-error-msg');
      const username = document.getElementById('portal-username').value.trim();
      const password = document.getElementById('portal-password').value;

      if (!username || !password) {
        errMsg.textContent = 'Please enter both username and password.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      errEl.classList.add('hidden');

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid credentials');

        sessionStorage.setItem('auth_token', data.token);
        routeUser(data.user);
      } catch (err) {
        errMsg.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Sign In`;
      }
    });
  </script>
</body>
</html>
